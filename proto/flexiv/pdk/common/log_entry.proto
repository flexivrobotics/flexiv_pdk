syntax = "proto3";

package flexiv.pdk.common;

import "google/protobuf/timestamp.proto";

message LogEntry {
  
  enum Level {
    DEBUG   = 0; // Default level.
    INFO    = 1;
    WARNING = 2;
    ERROR   = 3;
  }

  google.protobuf.Timestamp timestamp = 1; // [required]
  Level                     level     = 2; // [required]
  string                    source    = 3; // [required] Part of the server that wrote it, e.g. "ConfigService"
  string                    message   = 4; // [required]
}
