syntax = "proto3";

package flexiv.pdk.surface_finish.generator;

import "flexiv/pdk/spatial/geometry.proto";
import "flexiv/pdk/surface_finish/generator/surface_border.proto";

// Parameters to create a path by sampling waypoints on mesh, in a raster pattern.
//
// Add the mesh to the Flexiv PDK scene: 
// 1. Create flexiv.pdk.scene.Object
// 2. Add a flexiv.pdk.spatial.visual to the object
// 3. Set visual.shape.mesh to the mesh file
// 4. Add the object to scene using flexiv.pdk.scene.ConfigService.Add()
// 
// Use the SurfaceFinishService to generate the path, refine the path, and create robot motion.
message MeshRasterPath {
  // Optional. Mesh filename associated with the mesh, if parent has more than one visual mesh.
  string            mesh_filename                           = 1; 

   // fixed distance between waypoints [m]
  double            fixed_spacing                           = 2;

  // blending radius between toolpath segment [m]  
  double            blending_radius                         = 3; 

  // Polygon border to select region on the mesh. If empty, the whole mesh will be used to generate raster path.
  PolygonBorder     polygon_border                          = 4; 

  // Offset from polygon border to generate raster path [m]
  double            border_offset                           = 5; 

  // distance between raster lines [m]
  double            raster_line_spacing                     = 6; 

  // distance threshold to join raster path segments [m]
  double            raster_path_joining_distance_threshold  = 7; 

  oneof raster_direction {
    // rotation along the principal direction of the mesh, in radians [rad]
    double          principal_rotation_angle                = 8; 

    // specified direction in the world frame, as a 3D vector. The generator will project the vector onto the mesh to determine the raster direction.
    spatial.Vector3 specified_direction                     = 9;
  }

  // minimum toolpath length to keep after path splitting [m]. Shorter toolpaths will be removed. This is used to remove short toolpaths generated by raster pattern, which may not be executable or efficient to execute.
  double            minimum_toolpath_length                 = 10;

  // Orientation alignment options for the generated waypoints.
  oneof orientation_alignment {
    // Rotate waypoints, so that its x-axis is roughly aligned with the direction between the first two waypoints
    bool               align_with_initial_direction = 11; 

    // Rotate waypoints, so that its x-axis is roughly aligned with previous waypoint
    bool               align_with_previous          = 12; 

    // Rotate waypoints so that the x-axis is roughly aligned with this direction in world frame
    spatial.Vector3    align_with_direction         = 13; 
  }
}
