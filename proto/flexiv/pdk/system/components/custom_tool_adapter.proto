syntax = "proto3";

package flexiv.pdk.system.components;

import "flexiv/pdk/spatial/geometry.proto";
import "flexiv/pdk/spatial/shape.proto";
import "flexiv/pdk/physics/properties.proto";

// Custom tool adapter. Can be used in System.
// Get a list of all saved custom tool adapter using: ComponentsService.ListCustomToolAdapters
message CustomToolAdapter {
  string                     manufacturer = 1; // [required] From the list of saved custom tool adapters
  string                     model        = 2; // [required] From the list of saved custom tool adapters
  repeated spatial.SE3Pose   flange       = 3; // [required] Flanges for mounting tools, relative to tool base.
  physics.Inertial           inertial     = 4; // [optional] Default is 0.
  repeated spatial.Collision collision    = 5; // [optional] Default is no collision.
  repeated spatial.Visual    visual       = 6; // [optional] Default is no visual.
}
